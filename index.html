// ===== HELPERS =====
// Fix timezone : utilise l'heure locale, pas UTC
function localToday(){
  var now=new Date();
  return new Date(now.getFullYear(),now.getMonth(),now.getDate());
}
function dayOfProg(){
  var t=localToday();
  var s=new Date(PROG_START.getFullYear(),PROG_START.getMonth(),PROG_START.getDate());
  return Math.max(0,Math.min(Math.floor((t-s)/86400000),90));
}
function wkNum(d){return Math.floor(d/7)+1;}
function getPhase(w){for(var i=0;i<PHASES.length;i++){if(PHASES[i].weeks.indexOf(w)>=0)return PHASES[i];}return PHASES[3];}
function isVac(date){var d=new Date(date.getFullYear(),date.getMonth(),date.getDate());var vs=new Date(VAC_S.getFullYear(),VAC_S.getMonth(),VAC_S.getDate());var ve=new Date(VAC_E.getFullYear(),VAC_E.getMonth(),VAC_E.getDate());return d>=vs&&d<=ve;}
function getDC(date){var dow=date.getDay();return DAYS[dow===0?6:dow-1];}
// Retourne la date correspondant au jour sélectionné (idx 0=lun...6=dim)
function getSelectedDate(){
  if(selectedDayIdx===null)return localToday();
  var today=localToday();
  var todayDow=today.getDay(); // 0=dim,1=lun...
  var todayIdx=todayDow===0?6:todayDow-1; // 0=lun...6=dim
  var diff=selectedDayIdx-todayIdx;
  var d=new Date(today);d.setDate(today.getDate()+diff);
  return d;
}
function tKey(){var t=localToday();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");}
function fmtT(s){return Math.floor(s/60)+":"+(s%60<10?"0":"")+s%60;}
function el(id){return document.getElementById(id);}
function ce(tag){return document.createElement(tag);}

// ===== TIMER =====
function startTimer(){
  if(timerInterval)clearInterval(timerInterval);
  timerVal=0;timerRunning=true;
  var sb=el("tsb");if(sb)sb.textContent="⏸ PAUSE";
  timerInterval=setInterval(function(){
    timerVal++;
    var rem=Math.max(0,timerPreset-timerVal);
    var pct=Math.min(100,(timerVal/timerPreset)*100);
    var done=timerVal>=timerPreset;
    var td=el("tdis");var tb=el("tbar");
    if(td){td.textContent=done?"GO!":fmtT(rem);td.style.color=done?"#ff3a3a":"#fff";}
    if(tb){tb.style.width=pct+"%";tb.style.background=done?"#ff3a3a":"#ff7700";}
    if(done){clearInterval(timerInterval);timerRunning=false;var sb2=el("tsb");if(sb2)sb2.textContent="▶ START";try{navigator.vibrate&&navigator.vibrate([300,100,300]);}catch(e){}}
  },1000);
}
function stopTimer(){clearInterval(timerInterval);timerRunning=false;var sb=el("tsb");if(sb)sb.textContent="▶ START";}
function resetTimer(){stopTimer();timerVal=0;var td=el("tdis");var tb=el("tbar");if(td){td.textContent=fmtT(timerPreset);td.style.color="#fff";}if(tb)tb.style.width="0%";}

function showTimer(){
  var ov=el("tov");
  if(ov){ov.style.display="flex";return;}
  var overlay=ce("div");overlay.id="tov";overlay.className="modal-ov";
  var box=ce("div");box.className="modal-box";
  box.innerHTML='<div style="font-size:11px;letter-spacing:3px;color:#ff3a3a">CHRONO REPOS</div>'+
    '<div id="tdis" class="bebas" style="font-size:64px;color:#fff;line-height:1">'+fmtT(timerPreset)+'</div>'+
    '<div class="pbar" style="width:100%"><div id="tbar" class="pfill" style="width:0%;background:#ff7700"></div></div>'+
    '<div id="tpre" style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center"></div>'+
    '<div style="display:flex;gap:8px">'+
    '<button id="tsb" onclick="timerRunning?stopTimer():startTimer()" style="background:#ff3a3a;color:#fff;border:none;border-radius:8px;padding:12px 16px;font-size:12px;font-weight:900;letter-spacing:2px;cursor:pointer;font-family:inherit">▶ START</button>'+
    '<button onclick="resetTimer()" style="background:#222;color:#fff;border:none;border-radius:8px;padding:12px 16px;font-size:12px;font-weight:900;cursor:pointer;font-family:inherit">↺</button>'+

function makeCard(html,style){

function energyPicker(label,storedVal,onchange){
  var wrap=ce("div");
  wrap.innerHTML='<div style="font-size:10px;letter-spacing:2px;color:#888;margin-bottom:6px">'+label+'</div>';
  var row=ce("div");row.style.cssText="display:flex;gap:6px";
  for(var n=1;n<=5;n++){
    (function(n){
      var b=ce("button");
      b.style.cssText="width:36px;height:36px;border-radius:4px;border:none;cursor:pointer;background:"+(storedVal>=n?"#ff3a3a":"#1a1a1a")+";color:#fff;font-size:14px;font-weight:700;font-family:inherit";
      b.textContent=n;b.dataset.n=n;
      b.onclick=function(){
        onchange(n);
        row.querySelectorAll("button").forEach(function(b2){b2.style.background=parseInt(b2.dataset.n)<=n?"#ff3a3a":"#1a1a1a";});
      };
      row.appendChild(b);
    })(n);
  }
  wrap.appendChild(row);return wrap;
}

  var sr=ce("div");sr.style.cssText="display:flex;gap:8px";
  [[done,"SÉANCES ✅","#22c55e"],[partial,"PARTIELLES ⚡","#ff7700"],[skipped,"MANQUÉES ✗","#ff3a3a"]].forEach(function(p){
    var s=makeCard('<div style="font-size:10px;letter-spacing:2px;color:#888">'+p[1]+'</div><div class="bebas" style="font-size:36px;color:'+p[2]+';line-height:1">'+p[0]+'</div>',{flex:"1",textAlign:"center"});

  var mr=appData.maxRec||{},mh=appData.maxHist||{};

  div.appendChild(makeCard('<div style="font-size:12px;font-weight:700;letter-spacing:2px;margin-bottom:12px;color:#ff3a3a">MAX TRACTIONS</div>'+
    '<div style="display:flex;gap:16px;align-items:flex-end">'+
    '<div><div style="font-size:10px;color:#888">DERNIER MAX</div><div class="bebas" style="font-size:48px;color:#ff3a3a;line-height:1">'+(mr.pullups_reps||21)+'</div><div style="font-size:11px;color:#888">Objectif : 25+</div></div>'+
    '<div style="flex:1;display:flex;align-items:flex-end;gap:3px;height:60px">'+pullHist.map(function(v){return'<div style="flex:1;background:#ff3a3a;height:'+Math.max(4,Math.round((v/pullMax)*100))+'%;border-radius:2px;min-height:4px"></div>';}).join("")+'</div></div>'+
    (mr.pullups_qual?'<div style="font-size:11px;color:#555;margin-top:8px">Qualité : '+mr.pullups_qual+(mr.pullups_pain?' · Douleur : '+mr.pullups_pain:"")+'</div>':"")));

  var pushHist=mh.pushups||[50];var pushMax=Math.max.apply(null,pushHist.concat([80]));
  div.appendChild(makeCard('<div style="font-size:12px;font-weight:700;letter-spacing:2px;margin-bottom:12px;color:#ff7700">MAX POMPES</div>'+

    '<div style="flex:1;display:flex;align-items:flex-end;gap:3px;height:60px">'+pushHist.map(function(v){return'<div style="flex:1;background:#ff7700;height:'+Math.max(4,Math.round((v/pushMax)*100))+'%;border-radius:2px;min-height:4px"></div>';}).join("")+'</div></div>'));

  div.appendChild(makeCard('<div style="font-size:12px;font-weight:700;letter-spacing:2px;margin-bottom:10px">MUSCLE-UP</div>'+
    '<div style="display:flex;gap:12px">'+
    '<div style="flex:1;text-align:center;background:#0f0f0f;border-radius:6px;padding:10px"><div style="font-size:10px;color:#888">ACTUEL</div><div class="bebas" style="font-size:20px;color:#ff3a3a">5 kipping</div></div>'+
    '<div style="flex:1;text-align:center;background:#0f0f0f;border-radius:6px;padding:10px"><div style="font-size:10px;color:#888">OBJECTIF</div><div class="bebas" style="font-size:20px;color:#ff7700">3+ strict</div></div></div>'+
    '<div style="font-size:11px;color:#888;margin-top:8px">Jamais d\'échec · 2 échecs → régressions</div>'));

  var weights=appData.weights||{};
  var wE=Object.entries(weights).sort(function(a,b){return a[0].localeCompare(b[0]);}).slice(-14);
  var wMax=wE.length?Math.max.apply(null,wE.map(function(e){return e[1];}).concat([82])):82;
  var wMin=wE.length?Math.max(74,Math.min.apply(null,wE.map(function(e){return e[1];}).concat([78]))-1):76;
  div.appendChild(makeCard('<div style="font-size:12px;font-weight:700;letter-spacing:2px;margin-bottom:12px">POIDS (kg)</div>'+
    '<div style="display:flex;align-items:flex-end;gap:3px;height:70px;margin-bottom:8px">'+
    (wE.length?wE.map(function(e){var h=Math.max(4,Math.round(((e[1]-wMin)/(wMax-wMin+1))*100));return'<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px"><div style="flex:1;background:#ff3a3a;width:100%;height:'+h+'%;min-height:4px;border-radius:2px"></div><div style="font-size:8px;color:#444;transform:rotate(-45deg);white-space:nowrap">'+e[0].slice(5)+'</div></div>';}).join(""):'<div style="font-size:11px;color:#555;align-self:center">Aucune donnée</div>')+
    '</div><div style="display:flex;justify-content:space-between"><div><div style="font-size:10px;color:#888">DÉPART</div><div class="bebas" style="font-size:20px">78 kg</div></div><div style="text-align:right"><div style="font-size:10px;color:#888">OBJECTIF</div><div class="bebas" style="font-size:20px;color:#22c55e">+2 à +4 kg</div></div></div>'));

  var slE=Object.entries(appData.sleep||{}).sort(function(a,b){return a[0].localeCompare(b[0]);}).slice(-7);
  div.appendChild(makeCard('<div style="font-size:12px;font-weight:700;letter-spacing:2px;margin-bottom:8px">SOMMEIL — 7 JOURS</div>'+
    '<div style="display:flex;align-items:flex-end;gap:4px;height:50px;margin-bottom:6px">'+
    (slE.length?slE.map(function(e){var h=Math.max(4,Math.round(((e[1].hours||0)/9)*100));return'<div style="flex:1;background:'+(e[1].hours>=7?"#22c55e":"#ff3a3a")+';height:'+h+'%;min-height:4px;border-radius:2px"></div>';}).join(""):'<div style="font-size:11px;color:#555">Aucune donnée</div>')+
    '</div><div style="font-size:11px;color:#888">Objectif : 7h min · Vert ≥7h · Rouge <7h</div>'));

  var meas=appData.measures||{};
  div.appendChild(makeCard('<div style="font-size:12px;font-weight:700;letter-spacing:2px;margin-bottom:10px">MESURES PHYSIQUES</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+
    '<div style="background:#0f0f0f;border-radius:6px;padding:10px"><div style="font-size:9px;color:#555;letter-spacing:2px">TOUR BRAS</div><div class="bebas" style="font-size:22px">'+(meas.arm||"—")+' cm</div></div>'+
    '<div style="background:#0f0f0f;border-radius:6px;padding:10px"><div style="font-size:9px;color:#555;letter-spacing:2px">TOUR POITRINE</div><div class="bebas" style="font-size:22px">'+(meas.chest||"—")+' cm</div></div>'+
    '<div style="background:#0f0f0f;border-radius:6px;padding:10px"><div style="font-size:9px;color:#555;letter-spacing:2px">TOUR ÉPAULES</div><div class="bebas" style="font-size:22px">'+(meas.shoulders||"—")+' cm</div></div>'+
    '</div>'));
  return div;
}

function pageNutrition(){
  var div=ce("div");div.className="page";
  div.innerHTML='<div class="bebas" style="font-size:20px;letter-spacing:3px;margin-bottom:8px">NUTRITION</div>';
  var tk=tKey(),nt=(appData.nutrition||{})[tk]||{};

  // Weight
  var wc=makeCard('<div style="font-size:12px;font-weight:700;letter-spacing:2px;margin-bottom:8px">POIDS DU MATIN</div>');
  var wr=ce("div");wr.style.cssText="display:flex;gap:8px;align-items:center";
  var wi=ce("input");wi.type="number";wi.step="0.1";wi.placeholder="78.0";wi.className="inp";wi.style.cssText="width:100px;font-size:24px;font-family:'Bebas Neue',Arial,sans-serif;padding:8px 10px";wi.value=nt.weight||"";
  wi.oninput=function(){var n=appData.nutrition||{};n[tk]=Object.assign({},n[tk]||{},{weight:wi.value});setData("nutrition",n);var w=appData.weights||{};w[tk]=parseFloat(wi.value);setData("weights",w);};
  var kgl=ce("div");kgl.style.cssText="font-size:14px;color:#888";kgl.textContent="kg";
  wr.appendChild(wi);wr.appendChild(kgl);wc.appendChild(wr);
  var wn=ce("div");wn.style.cssText="font-size:11px;color:#888;margin-top:6px";wn.textContent="Objectif : +0.25 à +0.5 kg/semaine";wc.appendChild(wn);
  div.appendChild(wc);

  // Proteins
  var proto=nt.protein||0;var ppct=Math.min(100,(proto/165)*100);
  var pc=makeCard('<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div style="font-size:12px;font-weight:700;letter-spacing:2px">PROTÉINES</div><div id="protlbl" style="font-size:11px;color:#888">'+proto+'g / 165g</div></div>'+
    '<div class="pbar" style="margin-bottom:10px"><div id="protbar" class="pfill" style="width:'+ppct+'%;background:'+(ppct>=100?"#22c55e":"#ff3a3a")+'"></div></div>');
  var pi=ce("input");pi.type="number";pi.placeholder="0";pi.className="inp";pi.value=proto||"";
  pi.oninput=function(){
    var v=parseInt(pi.value)||0;var n=appData.nutrition||{};n[tk]=Object.assign({},n[tk]||{},{protein:v});setData("nutrition",n);
    var p=Math.min(100,(v/165)*100);var bar=el("protbar");var lbl=el("protlbl");
    if(bar){bar.style.width=p+"%";bar.style.background=p>=100?"#22c55e":"#ff3a3a";}
    if(lbl)lbl.textContent=v+"g / 165g";
  };
  pc.appendChild(pi);div.appendChild(pc);

  // Meals
  var mc=makeCard('<div style="font-size:12px;font-weight:700;letter-spacing:2px;margin-bottom:12px">REPAS DU JOUR</div>');
  [{k:"breakfast",l:"🍳 PETIT-DÉJEUNER",c:"#ff7700"},{k:"snack1",l:"🥜 COLLATION JOURNÉE",c:"#ff3a3a"},{k:"snack2",l:"🌙 COLLATION SOIR",c:"#888"}].forEach(function(meal){
    var row=ce("div");row.style.cssText="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #111;cursor:pointer";
    var ok=nt[meal.k];
    var chk=ce("div");chk.id="ml_"+meal.k;chk.style.cssText="width:24px;height:24px;border-radius:4px;border:2px solid "+(ok?meal.c:"#333")+";background:"+(ok?meal.c+"22":"transparent")+";display:flex;align-items:center;justify-content:center;color:"+meal.c+";font-size:14px";if(ok)chk.textContent="✓";
    var lbl=ce("div");lbl.id="mll_"+meal.k;lbl.style.cssText="font-size:13px;font-weight:700;color:"+(ok?meal.c:"#555");lbl.textContent=meal.l;
    row.onclick=function(){
      var n=appData.nutrition||{};var cur=!(n[tk]||{})[meal.k];n[tk]=Object.assign({},n[tk]||{});n[tk][meal.k]=cur;setData("nutrition",n);
      var c2=el("ml_"+meal.k);var l2=el("mll_"+meal.k);
      if(c2){c2.style.borderColor=cur?meal.c:"#333";c2.style.background=cur?meal.c+"22":"transparent";c2.textContent=cur?"✓":"";}
      if(l2)l2.style.color=cur?meal.c:"#555";
    };
    row.appendChild(chk);row.appendChild(lbl);mc.appendChild(row);
  });
  div.appendChild(mc);

  // Water
  var wac=makeCard('<div style="font-size:12px;font-weight:700;letter-spacing:2px;margin-bottom:10px">HYDRATATION</div>');
  var war=ce("div");war.style.cssText="display:flex;gap:6px;flex-wrap:wrap";
  var curW=nt.water;
  [1,1.5,2,2.5,3,3.5,4].forEach(function(l){
    var b=ce("button");b.className="chip";b.textContent=l+"L";b.dataset.l=l;
    if(curW===l)b.style.background="#0055aa";
    b.onclick=function(){var n=appData.nutrition||{};n[tk]=Object.assign({},n[tk]||{},{water:l});setData("nutrition",n);war.querySelectorAll("button").forEach(function(b2){b2.style.background=parseFloat(b2.dataset.l)===l?"#0055aa":"#1a1a1a";});};
    war.appendChild(b);
  });
  wac.appendChild(war);div.appendChild(wac);

  div.appendChild(makeCard('<div style="font-size:12px;font-weight:700;letter-spacing:2px;margin-bottom:10px">OPTIONS PETIT-DÉJEUNER</div>'+
    '<div style="padding:10px 0;border-bottom:1px solid #111"><div style="font-size:12px;font-weight:700;color:#ff7700">Option 1 — Avoine</div><div style="font-size:11px;color:#888;margin-top:2px">80-120g flocons · lait 300ml · banane · beurre cac · miel · 2-3 oeufs</div></div>'+
    '<div style="padding:10px 0;border-bottom:1px solid #111"><div style="font-size:12px;font-weight:700;color:#ff7700">Option 2 — Skyr</div><div style="font-size:11px;color:#888;margin-top:2px">300-400g skyr · muesli · fruits rouges · miel · amandes</div></div>'+
    '<div style="padding:10px 0;border-bottom:1px solid #111"><div style="font-size:12px;font-weight:700;color:#ff7700">Option 3 — Oeufs</div><div style="font-size:11px;color:#888;margin-top:2px">3-4 oeufs · pain · avocat / huile olive · fruit</div></div>'+
    '<div style="padding:10px 0"><div style="font-size:12px;font-weight:700;color:#ff7700">Option 4 — Shake</div><div style="font-size:11px;color:#888;margin-top:2px">500ml lait · banane · 80-100g flocons · whey · beurre cac · miel</div></div>'));
  div.appendChild(makeCard('<div style="font-size:11px;color:#ff3a3a;font-style:italic">Si le poids ne monte pas sur 14 jours → ajouter 250-300 kcal/jour</div>',{background:"#0f0f0f",border:"1px solid #ff3a3a33"}));
  return div;
}

function pageCalendar(){
  var div=ce("div");div.className="page";
  var header=ce("div");header.style.cssText="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px";
  header.innerHTML='<div class="bebas" style="font-size:20px;letter-spacing:3px">CALENDRIER 90J</div><div id="cwlbl" style="font-size:12px;color:#ff3a3a"></div>';
  div.appendChild(header);
  var nav=ce("div");nav.style.cssText="display:flex;gap:8px;margin-bottom:12px";
  var prev=ce("button");prev.className="chip";prev.style.flex="1";prev.textContent="← Préc.";
  var next=ce("button");next.className="chip";next.style.flex="1";next.textContent="Suiv. →";
  nav.appendChild(prev);nav.appendChild(next);div.appendChild(nav);
  var wc=ce("div");wc.id="calwc";div.appendChild(wc);

  function renderW(w){
    calWeek=w;
    var lbl=el("cwlbl");if(lbl)lbl.textContent="Semaine "+(w+1)+"/13";
    var ph=getPhase(w+1);
    var wcd=el("calwc");if(!wcd)return;wcd.innerHTML="";
    var phc=makeCard('<div style="font-size:11px;font-weight:700;color:'+ph.color+'">'+ph.name+'</div><div style="font-size:11px;color:#666">'+ph.desc+'</div>',{borderLeft:"3px solid "+ph.color,padding:"8px 12px",marginBottom:"8px"});
    wcd.appendChild(phc);
    var wStart=new Date(PROG_START);wStart.setDate(PROG_START.getDate()+w*7);
    var todStr=tKey();
    var sCol={complete:"#22c55e",partial:"#ff7700",fatigue:"#888",forced_rest:"#444",skipped:"#ff3a3a"};
    for(var i=0;i<7;i++){
      var d=new Date(wStart);d.setDate(wStart.getDate()+i);
      var dk=d.toISOString().split("T")[0];
      var cfg=getDC(d);var log=(appData.sessionLogs||{})[dk];
      var isT=(dk===todStr);var vac=isVac(d);var past=d<PROG_START;
      var r=makeCard(
        '<div style="display:flex;justify-content:space-between;align-items:center">'+
        '<div>'+
        '<div style="display:flex;align-items:center;gap:6px">'+
        '<span style="font-size:13px;font-weight:700;color:'+(isT?cfg.color:"#fff")+'">'+cfg.icon+' '+cfg.name+'</span>'+
        (isT?'<span style="font-size:9px;color:#ff3a3a;background:#ff3a3a22;padding:2px 6px;border-radius:2px">AUJOURD\'HUI</span>':'')+
        (vac?'<span style="font-size:9px;color:#ff7700;background:#ff770022;padding:2px 6px;border-radius:2px">🏖</span>':'')+
        '</div>'+
        '<div style="font-size:11px;color:#555">'+d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"})+' · '+cfg.label+'</div>'+
        '</div>'+
        '<div style="font-size:16px">'+(log?(log.status==="complete"?"✅":log.status==="partial"?"⚡":log.status==="skipped"?"✗":log.status==="forced_rest"?"🛑":"🔄"):" ")+'</div>'+
        '</div>',
        {borderLeft:"3px solid "+(log?sCol[log.status]||"#333":isT?cfg.color:"#222"),padding:"10px 14px",background:isT?"#0f0f0f":"#080808",opacity:past?0.3:1}
      );
      wcd.appendChild(r);
    }
    if(w>=1&&w<=3){wcd.appendChild(makeCard('<div style="font-size:12px;font-weight:700;color:#ff7700">🏖 VACANCES 9-17 MAI</div><div style="font-size:11px;color:#888">Mode sans salle · Min. 3 séances/semaine</div>',{border:"1px solid #ff700033",background:"#1a0f00"}));}
    wcd.appendChild(makeCard('<div style="font-size:12px;font-weight:700;color:#4488ff">💙 CARDIO ZONE 2</div><div style="font-size:11px;color:#888">2× par mois · Jeudi · 30 min · Footing/vélo/rameur</div>',{border:"1px solid #0055aa33"}));
  }
  prev.onclick=function(){renderW(Math.max(0,calWeek-1));};
  next.onclick=function(){renderW(Math.min(12,calWeek+1));};
  renderW(calWeek);
  return div;
}

function pageSettings(){
  var div=ce("div");div.className="page";
  div.innerHTML='<div class="bebas" style="font-size:20px;letter-spacing:3px;margin-bottom:8px">RÉGLAGES</div>';

  var muc=makeCard('<div style="font-size:12px;font-weight:700;letter-spacing:2px;margin-bottom:8px">2ÈME JOUR MUSCLE-UP</div><div style="font-size:11px;color:#888;margin-bottom:10px">Samedi = obligatoire. Choisir le 2ème :</div>');
  var muD=appData.muscleupDay||"mardi";
  ["mardi","jeudi","lundi (bonus)","aucun"].forEach(function(d){
    var b=ce("button");b.id="mud_"+d;
    b.style.cssText="display:block;width:100%;padding:12px 14px;margin-bottom:6px;border-radius:6px;border:1px solid "+(muD===d?"#ff3a3a":"#222")+";background:"+(muD===d?"#ff3a3a22":"#111")+";color:"+(muD===d?"#ff3a3a":"#555")+";font-size:13px;font-weight:700;text-align:left;cursor:pointer;letter-spacing:1px;font-family:inherit";
    b.textContent=d==="aucun"?"✗ Aucun (fatigue haute)":"▸ "+d.toUpperCase();
    b.onclick=function(){
      setData("muscleupDay",d);
      ["mardi","jeudi","lundi (bonus)","aucun"].forEach(function(d2){var b2=el("mud_"+d2);if(!b2)return;var on=(d2===d);b2.style.borderColor=on?"#ff3a3a":"#222";b2.style.background=on?"#ff3a3a22":"#111";b2.style.color=on?"#ff3a3a":"#555";});
    };
    muc.appendChild(b);
  });
  div.appendChild(muc);

  var mc=makeCard('<div style="font-size:12px;font-weight:700;letter-spacing:2px;margin-bottom:10px">MODE GLOBAL</div>');
  var cm=appData.dailyMode||"standard";
  [{k:"standard",l:"⚡ STANDARD"},{k:"hard",l:"🔥 HARD"},{k:"fatigue",l:"🔄 FATIGUE"}].forEach(function(m){
    var b=ce("button");b.id="gm_"+m.k;
    b.style.cssText="display:block;width:100%;padding:12px 14px;margin-bottom:6px;border-radius:6px;border:1px solid "+(cm===m.k?"#ff3a3a":"#222")+";background:"+(cm===m.k?"#ff3a3a22":"#111")+";color:"+(cm===m.k?"#ff3a3a":"#555")+";font-size:13px;font-weight:700;text-align:left;cursor:pointer;font-family:inherit";
    b.textContent=m.l;
    b.onclick=function(){setData("dailyMode",m.k);navigate("settings");};
    mc.appendChild(b);
  });
  div.appendChild(mc);

  var msc=makeCard('<div style="font-size:12px;font-weight:700;letter-spacing:2px;margin-bottom:12px">MESURES PHYSIQUES (cm)</div>');
  var meas=appData.measures||{};
  [{k:"arm",l:"TOUR DE BRAS"},{k:"chest",l:"TOUR DE POITRINE"},{k:"shoulders",l:"TOUR D\'ÉPAULES"}].forEach(function(m){
    var w=ce("div");w.style.marginBottom="10px";
    w.innerHTML='<div style="font-size:10px;color:#888;margin-bottom:4px;letter-spacing:2px">'+m.l+'</div>';
    var inp=ce("input");inp.type="number";inp.placeholder="cm";inp.className="inp";inp.value=meas[m.k]||"";
    inp.oninput=function(){var ms=appData.measures||{};ms[m.k]=inp.value;setData("measures",ms);};
    w.appendChild(inp);msc.appendChild(w);
  });
  div.appendChild(msc);

  var rc=makeCard('<div style="font-size:12px;font-weight:700;letter-spacing:2px;margin-bottom:8px;color:#ff3a3a">DANGER ZONE</div>');
  var rb=ce("button");rb.className="btn-red";rb.style.cssText="background:#1a0000;border:1px solid #ff3a3a44;color:#ff3a3a";rb.textContent="✕ RÉINITIALISER LES DONNÉES";
  rb.onclick=function(){if(confirm("Effacer toutes les données ?")){localStorage.clear();location.reload();}};
  rc.appendChild(rb);div.appendChild(rc);
  return div;
}

// ===== NAV =====
var NAVITEMS=[{k:"home",l:"HOME",i:"⚡"},{k:"session",l:"SÉANCE",i:"🔥"},{k:"progress",l:"STATS",i:"📈"},{k:"nutrition",l:"NUTRI",i:"🥩"},{k:"calendar",l:"PLANNING",i:"📅"},{k:"settings",l:"CONFIG",i:"⚙️"}];

function buildNav(){
  var nb=el("bottomnav");
  NAVITEMS.forEach(function(n){
    var b=ce("button");b.className="navbtn"+(curPage===n.k?" active":"");b.id="nav_"+n.k;
    var ico=ce("div");ico.className="naviico";ico.textContent=n.i;
    var lbl=ce("div");lbl.className="navilbl";lbl.textContent=n.l;
    b.appendChild(ico);b.appendChild(lbl);
    b.onclick=function(){navigate(n.k);};
    nb.appendChild(b);
  });
}

function navigate(pg){
  curPage=pg;checked={};
  document.querySelectorAll(".navbtn").forEach(function(b){b.classList.remove("active");});
  var nb=el("nav_"+pg);if(nb)nb.classList.add("active");
  var dn=dayOfProg(),wk=wkNum(dn);
  var ti=el("topinfo");if(ti)ti.textContent="J"+(dn+1)+" · S"+wk;
  var content=el("content");content.innerHTML="";
  var pgEl;
  if(pg==="home")pgEl=pageHome();
  else if(pg==="session")pgEl=pageSession();
  else if(pg==="progress")pgEl=pageProgress();
  else if(pg==="nutrition")pgEl=pageNutrition();
  else if(pg==="calendar")pgEl=pageCalendar();
  else if(pg==="settings")pgEl=pageSettings();
  if(pgEl)content.appendChild(pgEl);
  window.scrollTo(0,0);
}

buildNav();
navigate("home");
</script>
